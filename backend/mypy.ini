# Başlangıç tip kontrolü: annotate edilmiş fonksiyon gövdeleri kontrol edilir; stub'ı olmayan
# üçüncü parti paketler yok sayılır. Çalıştırma: backend dizininde `python -m mypy`.
[mypy]
python_version = 3.13
files = app
ignore_missing_imports = True
warn_unused_configs = True

# Baseline: CI eklendiğinde hata veren modüller. Modül temizlendikçe listeden çıkarın;
# yeni modüller buraya eklenmez.
[mypy-app.main,app.parser,app.pipeline,app.repository,app.storage,app.telemetry]
ignore_errors = True

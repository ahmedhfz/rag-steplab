name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node .github/scripts/classify-changes.mjs --self-test
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          node .github/scripts/classify-changes.mjs < changed-files.txt | tee classification.txt
          cat classification.txt >> "$GITHUB_OUTPUT"

      - name: Reject secret-shaped tracked values
        shell: bash
        run: |
          set -euo pipefail
          if secret_files="$(git grep -lE 'AIza[0-9A-Za-z_-]{20,}|(ghp_|github_pat_|xox[baprs]-)[A-Za-z0-9_-]{10,}|postgres(ql)?://[^[:space:]]+:[^@[:space:]]+@' -- .)"; then
            echo "::error::A secret-shaped value was found in tracked files (content is intentionally not printed)."
            printf '%s\n' "$secret_files"
            exit 1
          fi

      - name: Validate GitHub Actions workflows
        if: steps.classify.outputs.workflow_config == 'true'
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Set up Node.js
        if: steps.classify.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        if: steps.classify.outputs.node == 'true'
        run: npm ci

      - name: Audit production npm dependencies
        if: steps.classify.outputs.node == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Lint changed JavaScript and TypeScript
        if: steps.classify.outputs.frontend == 'true' || steps.classify.outputs.playwright_list == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t lint_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | grep -E '\.(cjs|mjs|js|jsx|ts|tsx)$' || true)
          if [ "${#lint_files[@]}" -eq 0 ]; then
            echo "No changed lintable files."
            exit 0
          fi
          npx eslint "${lint_files[@]}"

      - name: Typecheck frontend
        if: steps.classify.outputs.frontend == 'true' || steps.classify.outputs.playwright_list == 'true'
        run: npm run typecheck

      - name: Run changed Vitest tests
        if: steps.classify.outputs.frontend == 'true' && steps.classify.outputs.frontend_full_tests != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm test -- --changed "$BASE_SHA" --passWithNoTests --maxWorkers=1

      - name: Run full Vitest fallback
        if: steps.classify.outputs.frontend_full_tests == 'true'
        run: npm test -- --maxWorkers=1

      - name: Validate Playwright inventory
        if: steps.classify.outputs.playwright_list == 'true'
        run: npx playwright test --list

      - name: Set up Python
        if: steps.classify.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lightweight backend dependencies
        if: steps.classify.outputs.backend == 'true'
        run: python -m pip install --disable-pip-version-check -r backend/requirements-ci.txt

      - name: Audit Python requirement files
        if: steps.classify.outputs.backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip-audit==2.10.0
          # requirements-worker.txt includes the base backend requirements.
          python -m pip_audit --progress-spinner off -r backend/requirements-worker.txt
          python -m pip_audit --progress-spinner off -r backend/requirements-ci.txt

      - name: Run all backend unit and contract tests
        if: steps.classify.outputs.backend == 'true'
        run: python -m pytest backend/tests

      - name: Install Supabase CLI
        if: steps.classify.outputs.database == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Validate Supabase migrations
        if: steps.classify.outputs.database == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-migration-authority.mjs
          supabase db start
          supabase db reset --local --no-seed
          supabase test db --local
          supabase db lint --local --schema rag_lab --fail-on error

      - name: Stop local Supabase
        if: always() && steps.classify.outputs.database == 'true'
        continue-on-error: true
        run: supabase stop --project-id rag-steplab --no-backup

      - name: Restore Playwright Chromium
        if: steps.classify.outputs.auth_e2e == 'true' || steps.classify.outputs.critical_e2e == 'true' || steps.classify.outputs.production_visual == 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium system dependencies
        if: (steps.classify.outputs.auth_e2e == 'true' || steps.classify.outputs.critical_e2e == 'true' || steps.classify.outputs.production_visual == 'true') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install Chromium and system dependencies
        if: (steps.classify.outputs.auth_e2e == 'true' || steps.classify.outputs.critical_e2e == 'true' || steps.classify.outputs.production_visual == 'true') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Wait for exact Vercel Preview deployment
        if: steps.classify.outputs.auth_e2e == 'true' || steps.classify.outputs.critical_e2e == 'true' || steps.classify.outputs.production_visual == 'true'
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_ENVIRONMENT: Preview
        run: node scripts/e2e.mjs wait-deployment

      - name: Run minimum real auth E2E
        if: steps.classify.outputs.auth_e2e == 'true'
        env:
          E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
        run: npm run e2e:auth

      - name: Run critical smoke suite
        if: steps.classify.outputs.critical_e2e == 'true'
        env:
          E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
        run: npm run e2e:critical

      - name: Run production visual suite
        if: steps.classify.outputs.production_visual == 'true'
        env:
          E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
        run: npm run e2e:visual:production

      - name: Upload Playwright failure artifacts
        if: failure() && (steps.classify.outputs.auth_e2e == 'true' || steps.classify.outputs.critical_e2e == 'true' || steps.classify.outputs.production_visual == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright
            !output/playwright/.auth/**
          if-no-files-found: ignore
          retention-days: 3

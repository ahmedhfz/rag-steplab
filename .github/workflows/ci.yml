name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_ci:
        description: Run every validation and deployment gate applicable to this ref
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      backend: ${{ steps.classify.outputs.backend }}
      database: ${{ steps.classify.outputs.database }}
      modal: ${{ steps.classify.outputs.modal }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate classification examples
        run: node .github/scripts/classify-changes.mjs --self-test

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_CI_INPUT: ${{ inputs.full_ci }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FULL_CI_INPUT" == "true" ]]; then
            printf 'frontend=true\nbackend=true\ndatabase=true\nmodal=true\ndocs_only=false\nfull_ci=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_BEFORE" =~ ^0+$ || -z "$EVENT_BEFORE" ]]; then
            base_sha="$(git rev-list --max-parents=0 "$GITHUB_SHA" | tail -n 1)"
            head_sha="$GITHUB_SHA"
          else
            base_sha="$EVENT_BEFORE"
            head_sha="$GITHUB_SHA"
          fi

          git diff --name-only "$base_sha" "$head_sha" \
            | node .github/scripts/classify-changes.mjs > classification.txt
          cat classification.txt >> "$GITHUB_OUTPUT"
          cat classification.txt

  frontend:
    name: Frontend quality gates
    if: ${{ needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.full_ci == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test -- --maxWorkers=1

      - name: Production build
        run: npm run build

      - name: Smoke script syntax
        run: node --check scripts/smoke.mjs

  backend:
    name: Backend quality gates
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.full_ci == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-worker.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Backend tests
        run: python -m pytest backend/tests

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject secret-shaped values
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}|(ghp_|github_pat_|xox[baprs]-)[A-Za-z0-9_-]{10,}|postgres(ql)?://[^[:space:]]+:[^@[:space:]]+@' -- .; then
            echo "A secret-shaped value was found in tracked files."
            exit 1
          fi

  supabase-migrations:
    name: Supabase migration validation
    if: ${{ needs.detect-changes.outputs.database == 'true' || needs.detect-changes.outputs.full_ci == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Validate migration authority and filenames
        run: node scripts/check-migration-authority.mjs

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild schema from empty local database
        run: supabase db reset --local --no-seed

      - name: Run schema assertions
        run: supabase test db --local

      - name: Run Supabase schema lint
        run: supabase db lint --local --schema rag_lab --fail-on error

      - name: Stop local Supabase stack
        if: always()
        continue-on-error: true
        run: supabase stop --project-id rag-steplab --no-backup

  supabase-migrate-production:
    name: Apply Supabase migrations
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        (needs.detect-changes.outputs.database == 'true' || needs.detect-changes.outputs.full_ci == 'true') &&
        needs.secret-hygiene.result == 'success' &&
        (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
        (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
        needs.supabase-migrations.result == 'success'
      }}
    needs: [detect-changes, frontend, backend, secret-hygiene, supabase-migrations]
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Verify Supabase deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending migrations
        run: supabase db push --linked --yes --skip-vault

      - name: Verify migration status is aligned
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked
          status="$(supabase db push --linked --dry-run --yes --skip-vault --output-format json)"
          printf '%s\n' "$status"
          jq -e '.upToDate == true' <<<"$status" >/dev/null

  deploy-modal:
    name: Deploy Modal production
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        (needs.detect-changes.outputs.modal == 'true' || needs.detect-changes.outputs.full_ci == 'true') &&
        needs.secret-hygiene.result == 'success' &&
        needs.backend.result == 'success' &&
        (
          needs.supabase-migrations.result == 'success' ||
          (needs.detect-changes.outputs.database != 'true' && needs.detect-changes.outputs.full_ci != 'true')
        ) &&
        (
          needs.supabase-migrate-production.result == 'success' ||
          (needs.detect-changes.outputs.database != 'true' && needs.detect-changes.outputs.full_ci != 'true')
        )
      }}
    needs: [detect-changes, backend, secret-hygiene, supabase-migrations, supabase-migrate-production]
    runs-on: ubuntu-latest
    concurrency:
      group: modal-production
      cancel-in-progress: false
    env:
      MODAL_ENVIRONMENT: main
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_API_URL: https://ahmedhfz-dev--rag-steplab-api-api-eu.modal.run
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned Modal CLI
        run: python -m pip install modal==1.5.4

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          modal token info

      - name: Deploy tested Git SHA to Modal
        run: modal deploy --env "$MODAL_ENVIRONMENT" --tag "$GITHUB_SHA" --strategy rolling backend/modal_app.py

      - name: Verify Modal deployment tag
        shell: bash
        run: |
          set -euo pipefail
          modal app history rag-steplab-api --env "$MODAL_ENVIRONMENT" --json \
            | python -c 'import json, os, sys; history=json.load(sys.stdin); actual=history[0].get("tag") if history else None; expected=os.environ["GITHUB_SHA"]; assert actual == expected, f"Expected Modal tag {expected}, got {actual}"'

      - name: Verify deployed API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            docs_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$MODAL_API_URL/openapi.json")"
            protected_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$MODAL_API_URL/capabilities")"
            if curl --fail --silent --show-error "$MODAL_API_URL/health" >/dev/null \
              && curl --fail --silent --show-error "$MODAL_API_URL/ready" >/dev/null \
              && [ "$docs_status" = "404" ] \
              && [ "$protected_status" = "401" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Modal API did not become healthy after deployment."
          exit 1

      - name: Verify Vercel production uses the same Git SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            deployment_ids="$(gh api --method GET "repos/$GITHUB_REPOSITORY/deployments" \
              -f sha="$GITHUB_SHA" \
              -f environment=Production \
              -f per_page=10 \
              --jq '.[].id')"
            for deployment_id in $deployment_ids; do
              target_url="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].target_url // empty')"
              # Ignore GitHub Actions environment deployments from older runs;
              # the Vercel status points to vercel.com instead.
              if [[ "$target_url" == *"github.com/$GITHUB_REPOSITORY/actions/runs/"* ]]; then
                continue
              fi
              state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].state // empty')"
              if [ "$state" = "success" ]; then
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "Vercel production deployment failed for $GITHUB_SHA."
                exit 1
              fi
            done
            sleep 10
          done
          echo "No successful Vercel production deployment found for $GITHUB_SHA."
          exit 1

  ci-result:
    name: CI result
    if: always()
    needs: [detect-changes, frontend, backend, secret-hygiene, supabase-migrations, supabase-migrate-production, deploy-modal]
    runs-on: ubuntu-latest
    steps:
      - name: Require every executed gate to pass
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(printf '%s\n' "$NEEDS_JSON" | jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length')"
          if [ "$failed" != "0" ]; then
            echo "One or more executed CI gates failed."
            exit 1
          fi
          echo "All executed gates passed; intentional skips are successful."

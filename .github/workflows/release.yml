name: Production release

# Her main push'unda çalışır ve kararlarını diff'ten değil production durumundan verir:
# bekleyen migration `supabase db push --dry-run`, Modal deploy ihtiyacı ise canlı Modal
# tag'i ile hedef SHA arasındaki farktan çıkarılır. Böylece iptal edilen/başarısız bir
# run'ın migration veya backend değişikliği sonraki run'da kaybolmaz. Vercel production
# promotion'ı bu job'un check'ine bağlanır (Vercel Deployment Checks; docs/deployment.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Rollback/redeploy için main geçmişindeki commit SHA'sı (boş = main HEAD)
        required: false
        type: string
        default: ""
      force_modal_deploy:
        description: Canlı Modal tag'i hedefle aynı olsa bile yeniden deploy et
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Production release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Production secret'ları yalnız bu environment'ta; deployment branch policy = main.
    environment: production-release
    env:
      MODAL_APP: rag-steplab-api
      MODAL_ENVIRONMENT: main
      MODAL_API_URL: https://ahmedhfz-dev--rag-steplab-api-api-eu.eu-west.modal.run
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release target
        id: target
        shell: bash
        env:
          INPUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
        run: |
          set -euo pipefail
          target_sha="$GITHUB_SHA"
          if [ -n "$INPUT_REF" ]; then
            target_sha="$(git rev-parse --verify "${INPUT_REF}^{commit}")"
            # Yalnız main'e merge edilmiş (gözden geçirilmiş) kod production'a gider.
            git merge-base --is-ancestor "$target_sha" "$GITHUB_SHA"
          fi
          mode=release
          target_dir="$GITHUB_WORKSPACE"
          if [ "$target_sha" != "$GITHUB_SHA" ]; then
            # Workflow araçları main HEAD'den gelir; deploy edilen backend hedef SHA'nın ayrı checkout'udur.
            mode=rollback
            target_dir="$RUNNER_TEMP/release-target"
            git worktree add --quiet --detach "$target_dir" "$target_sha"
          fi
          {
            echo "sha=$target_sha"
            echo "mode=$mode"
            echo "dir=$target_dir"
          } >> "$GITHUB_OUTPUT"
          echo "Release target: \`$target_sha\` ($mode)" >> "$GITHUB_STEP_SUMMARY"

      - name: Reject secret-shaped tracked values
        run: bash .github/scripts/scan-secrets.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install locked backend CI dependencies
        # Hedef SHA'nın lock'u: deploy eden Modal client'ı ve test edilen paketler deploy edilenle aynı.
        working-directory: ${{ steps.target.outputs.dir }}
        run: python -m pip install --disable-pip-version-check -r backend/requirements-ci.txt

      - name: Read deployed Modal tag
        id: deployed
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          deployed="$(modal app history "$MODAL_APP" --env "$MODAL_ENVIRONMENT" --json | python -c 'import json, sys; history = json.load(sys.stdin); print((history[0].get("tag") or "") if history else "")')"
          echo "tag=$deployed" >> "$GITHUB_OUTPUT"
          echo "Deployed Modal tag: \`${deployed:-none}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Classify changes since the deployed Modal revision
        id: classify
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          MODE: ${{ steps.target.outputs.mode }}
          DEPLOYED_TAG: ${{ steps.deployed.outputs.tag }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_modal_deploy || false }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "release" ] && [ "$FORCE" != "true" ] && [[ "$DEPLOYED_TAG" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${DEPLOYED_TAG}^{commit}" 2>/dev/null; then
            git diff --name-only "$DEPLOYED_TAG" "$TARGET_SHA" | node .github/scripts/classify-changes.mjs | tee classification.txt
            grep -E '^(modal_deploy|worker_provider)=' classification.txt >> "$GITHUB_OUTPUT"
          else
            # Bilinmeyen/elle konmuş tag, rollback veya zorla redeploy: güvenli taraf tam deploy.
            echo "modal_deploy=true" >> "$GITHUB_OUTPUT"
            echo "worker_provider=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify backend contracts
        if: steps.classify.outputs.modal_deploy == 'true'
        working-directory: ${{ steps.target.outputs.dir }}
        run: python -m pytest backend/tests

      - name: Install Supabase CLI
        if: steps.target.outputs.mode == 'release'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.116.0

      - name: Check pending production migrations
        if: steps.target.outputs.mode == 'release'
        id: migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          status="$(supabase db push --linked --dry-run --yes --skip-vault --output-format json)"
          printf '%s\n' "$status"
          if jq -e '.upToDate == true' <<<"$status" >/dev/null; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate pending migrations locally
        if: steps.migrations.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-migration-authority.mjs
          supabase db start
          supabase db reset --local --no-seed
          supabase test db --local
          supabase db lint --local --schema rag_lab --fail-on error

      - name: Stop local Supabase
        if: always() && steps.migrations.outputs.pending == 'true'
        continue-on-error: true
        run: supabase stop --project-id rag-steplab --no-backup

      - name: Apply production migrations
        if: steps.migrations.outputs.pending == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --yes --skip-vault

      - name: Verify production migration alignment
        if: steps.target.outputs.mode == 'release'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked
          status="$(supabase db push --linked --dry-run --yes --skip-vault --output-format json)"
          printf '%s\n' "$status"
          jq -e '.upToDate == true' <<<"$status" >/dev/null

      - name: Check production schema drift (read-only)
        if: steps.target.outputs.mode == 'release'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Migration'larla kurulan şema ile canlı `rag_lab` şeması aynı olmalı; dashboard'dan
          # elle yapılmış değişiklik yeni kodun yanlış şemaya deploy edilmesini engeller.
          supabase db diff --linked --schema rag_lab > schema-drift.sql
          if grep -qE '[^[:space:]]' schema-drift.sql; then
            echo "::error::Production rag_lab schema differs from supabase/migrations. Capture the change as a migration before releasing."
            cat schema-drift.sql
            exit 1
          fi
          echo "No rag_lab schema drift."

      - name: Deploy target SHA to Modal
        if: steps.classify.outputs.modal_deploy == 'true'
        working-directory: ${{ steps.target.outputs.dir }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: modal deploy --env "$MODAL_ENVIRONMENT" --tag "$TARGET_SHA" --strategy rolling backend/modal_app.py

      - name: Verify Modal deployment tag
        if: steps.classify.outputs.modal_deploy == 'true'
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          modal app history "$MODAL_APP" --env "$MODAL_ENVIRONMENT" --json | python -c 'import json, os, sys; history=json.load(sys.stdin); actual=history[0].get("tag") if history else None; expected=os.environ["TARGET_SHA"]; assert actual == expected, f"Expected Modal tag {expected}, got {actual}"'

      - name: Verify deployed worker imports
        if: steps.classify.outputs.worker_provider == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -c "import os, modal; result=modal.Function.from_name(os.environ['MODAL_APP'], 'remote_import_smoke', environment_name=os.environ['MODAL_ENVIRONMENT']).remote(); assert result['appImported'] and result['parserImported'] and result['doclingVersion']"

      - name: Verify deployed API health and protection
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            echo "Checking Modal API health (attempt $attempt/12)."
            docs_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$MODAL_API_URL/openapi.json")"
            protected_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$MODAL_API_URL/capabilities")"
            if curl --fail --silent --show-error "$MODAL_API_URL/health" >/dev/null && curl --fail --silent --show-error "$MODAL_API_URL/ready" >/dev/null && [ "$docs_status" = "404" ] && [ "$protected_status" = "401" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Modal API did not become healthy after deployment."
          exit 1

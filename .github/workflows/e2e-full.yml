name: Heavy validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Heavy suite to run against the selected Git ref
        required: true
        type: choice
        default: critical-smoke
        options:
          - critical-smoke
          - auth
          - production-visual
          - full-rag

permissions:
  contents: read
  deployments: read

concurrency:
  group: heavy-validation-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
      SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
      E2E_API_BASE_URL: https://ahmedhfz-dev--rag-steplab-api-api-eu.eu-west.modal.run
      E2E_TARGET: production
      E2E_ALLOW_PRODUCTION_CLEANUP: "true"
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure dedicated E2E user
        run: npm run e2e:user

      - name: Clean stale namespaced full-RAG data
        if: inputs.suite == 'full-rag'
        run: npm run e2e:cleanup

      - name: Find exact Vercel deployment
        if: inputs.suite != 'full-rag'
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_SHA: ${{ github.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
        run: node scripts/e2e.mjs wait-deployment

      - name: Run critical smoke suite
        if: inputs.suite == 'critical-smoke'
        env:
          E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
        run: npm run e2e:critical

      - name: Run real auth E2E
        if: inputs.suite == 'auth'
        env:
          E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
        run: npm run e2e:auth

      - name: Run production React visual suite
        if: inputs.suite == 'production-visual'
        env:
          E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
        run: npm run e2e:visual:production

      - name: Run real provider full-RAG E2E
        if: inputs.suite == 'full-rag'
        env:
          E2E_BASE_URL: https://rag-steplab.vercel.app
        run: npm run e2e:full

      - name: Cleanup namespaced full-RAG data
        if: always() && inputs.suite == 'full-rag'
        run: npm run e2e:cleanup

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-heavy-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright
            !output/playwright/.auth/**
          if-no-files-found: ignore
          retention-days: 3

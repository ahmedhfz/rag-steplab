      .answer-quality { margin-top:28px; }
      .cases { height:198px; padding:20px; }

      .vs { color:var(--quiet); text-align:center; font-size:12px; }

      .delta-list { margin-top:20px; display:grid; gap:18px; }

      .insight { min-height:75px; margin-top:32px; padding:20px; color:var(--muted); font-size:13.5px; line-height:21px; }
      .settings-card { width:720px; margin-top:32px; overflow:hidden; }

      .settings-control span { padding:6px 10px; border-radius:7px; color:var(--quiet); font-size:12px; }
      .settings-control .selected { background:#fff; color:var(--text); box-shadow:0 1px 2px rgb(0 0 0 / 8%); }
      .auth-page { width:1441.449px; height:1040.856px; display:flex; align-items:center; justify-content:center; background:var(--canvas); }
      .auth-card { width:1040px; height:668.644px; display:grid; grid-template-columns:1fr 1fr; overflow:hidden; border:1.712px solid var(--border); border-radius:18px; background:#fff; }

      .auth-brand { display:flex; align-items:center; gap:10px; }
      .auth-brand img { width:28px; height:28px; }
      .auth-brand strong { font-size:15px; font-weight:600; }
      .auth-promo h1 { margin-top:70px; font-size:26px; line-height:32px; letter-spacing:-.52px; }
      .auth-promo > p { max-width:360px; margin-top:12px; color:var(--muted); font-size:14px; line-height:21px; }
      .auth-feature { margin-top:24px; display:grid; gap:16px; }
      .auth-feature strong { display:block; font-size:13.5px; line-height:20px; font-weight:500; }
      .auth-feature p { margin:3px 0 0; color:var(--muted); font-size:12.5px; line-height:18px; }
      .auth-placeholder { height:76px; margin-top:32px; border:1.712px dashed var(--input); border-radius:12px; display:grid; place-items:center; color:var(--quiet); font-family:"Geist Mono",monospace; font-size:10px; letter-spacing:.8px; }
      .auth-form { padding:40px; display:flex; flex-direction:column; justify-content:center; }
      .auth-form h2 { margin:0; font-size:24px; line-height:30px; font-weight:600; letter-spacing:-.48px; }
      .auth-form > p { margin:8px 0 0; color:var(--muted); font-size:13.5px; line-height:20px; }
      .form-fields { margin-top:28px; display:grid; gap:16px; }
      .form-field label { display:block; font-size:12.5px; line-height:18px; font-weight:500; }

      .auth-submit { width:100%; margin-top:24px; }

      .auth-divider::before, .auth-divider::after { content:""; height:1px; flex:1; background:var(--border); }
      .google { width:100%; }
      .auth-switch { margin-top:20px; color:var(--muted); font-size:12.5px; text-align:center; }

    </style>
  </head>
  <body>
    <div id="fixture" class="screen-root" data-testid="figma-canonical-root"></div>
    <script>
      const asset = (name) => `/assets/figma/overview/${name}.svg`;
      const icon = (name, alt = "") => `<img alt="${alt}" src="${asset(name)}" />`;
      const sidebar = (active) => `
        <aside class="fixture-sidebar" data-testid="figma-canonical-sidebar">
          <div class="brand">${icon("brand-mark")}<strong>RAG StepLab</strong></div>
          <nav class="nav" aria-label="Fixture navigation">
            <div class="nav-item ${active === "overview" ? "active" : ""}">${icon("overview")}Overview</div>
            <div class="nav-label">Build</div>
            <div class="nav-item ${active === "documents" ? "active" : ""}">${icon("documents")}Documents</div>
            <div class="nav-item ${active === "parsing" ? "active" : ""}">${icon("parsing")}Parsing</div>
            <div class="nav-item ${active === "chunking" ? "active" : ""}">${icon("chunking")}Chunking</div>
            <div class="nav-item ${active === "embeddings" ? "active" : ""}">${icon("embeddings")}Embeddings</div>
            <div class="nav-label">Test</div>
            <div class="nav-item ${active === "playground" ? "active" : ""}">${icon("playground")}Playground</div>
            <div class="nav-item ${active === "evaluation" ? "active" : ""}">${icon("evaluation")}Evaluation</div>
          </nav>
          <div class="sidebar-footer">
            <div class="nav-item ${active === "settings" ? "active" : ""}">${icon("settings")}Settings</div>
            <div class="user-row"><div class="user"><span class="avatar">AY</span><span>Ayşe Y.</span></div><div class="lang"><span class="selected">EN</span><span>TR</span></div></div>
          </div>
        </aside>`;
      const shell = (active, body, name) => `<div class="fixture-shell" data-screen="${name}">${sidebar(active)}<main class="fixture-main" data-testid="figma-canonical-main"><div class="fixture-page" data-testid="figma-canonical-page">${body}</div></main></div>`;
      const header = (eyebrow, title, description, action = "") => `<header class="page-header" data-testid="figma-canonical-header"><div class="page-header-copy"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${action ? `<div>${action}</div>` : ""}</header>`;
      const status = (text, tone = "success") => `<span class="status ${tone}">${text}</span>`;

      function documents() {
        const rows = [
          ["Karaman Operations.pdf", "· Current", "48", "4.2 MB", "Today, 09:14", "Parsed", "success"],
          ["Field Safety Manual.pdf", "", "126", "8.7 MB", "Yesterday", "Ready to parse", "muted-status"],
          ["Q2 Maintenance Report.pdf", "", "22", "1.9 MB", "Aug 21, 2026", "Processing", "cherry"],
          ["Vendor Contract — Draft.pdf", "", "9", "612 KB", "Aug 19, 2026", "Failed", "danger"],
        ];
        return shell("documents", `${header("Build", "Documents", "Add and manage the source documents used by your RAG.", `<button class="button primary">＋&nbsp; Add document</button>`)}
          <section class="dropzone" data-testid="figma-documents-dropzone"><div class="upload-icon"><span>⇧</span></div><strong>Drag &amp; drop a PDF here</strong><p>or <a>browse your files</a>. PDF only, up to 50 MB.</p></section>
          <div class="library-heading"><h2>Document library</h2><span>4 documents</span></div>
          <section class="surface doc-table" data-testid="figma-documents-library"><div class="doc-row header"><span>Document</span><span>Pages</span><span>Size</span><span>Uploaded</span><span>Status</span></div><div class="doc-rows">${rows.map((row) => `<div class="doc-row"><div class="doc-main"><span class="file-icon">▤</span><div><div class="file-name">${row[0]} <small>${row[1]}</small></div><div class="file-type">PDF</div></div></div><span class="doc-cell">${row[2]}</span><span class="doc-cell">${row[3]}</span><span class="doc-cell">${row[4]}</span>${status(row[5], row[6])}</div>`).join("")}</div></section>`, "documents-populated");
      }

      function parsing() {
        return shell("parsing", `${header("Build", "Parsing", "Turn a PDF into structured content the rest of your RAG pipeline can use.", `<div><button class="button">Reparse</button>&nbsp;<button class="button primary">Continue to Chunking&nbsp; →</button></div>`)}
          <section class="surface summary-bar" data-testid="figma-parsing-document"><div class="summary-left"><div class="summary-icon">${icon("documents1")}</div><div><div class="summary-label">Document</div><div class="summary-title">Karaman Operations.pdf</div></div></div>${status("Parsed")}</section>
          <section class="metrics-section" data-testid="figma-parsing-summary"><div class="section-label">Result summary</div><div class="metrics-grid">${[["Pages","48"],["Headings","126"],["Paragraphs","742"],["Lists","38"],["Tables","12"],["Elements","1,204"]].map(([a,b]) => `<div><div class="metric-label">${a}</div><div class="metric-value">${b}</div></div>`).join("")}</div></section>
          <div class="structured-heading"><h2>Structured content</h2><button class="small-button">▣ &nbsp; View source</button></div>
          <section class="surface structured-card" data-testid="figma-parsing-structured"><aside class="outline"><strong>Heading hierarchy</strong><div class="outline-item selected">1. Overview <small>p.3</small></div><div class="outline-item">1.1 Facility Layout <small>p.4</small></div><div class="outline-item">1.2 Operating Hours <small>p.6</small></div><div class="outline-item">2. Safety Procedures <small>p.9</small></div><div class="outline-item">2.1 PPE Requirements <small>p.10</small></div><div class="outline-item">3. Maintenance Schedule <small>p.18</small></div></aside><article class="article"><div class="breadcrumbs">Overview&nbsp; › &nbsp;Facility Layout</div><h3>1.1 Facility Layout</h3><p>The Karaman facility spans three interconnected operational zones. The primary processing area handles intake and initial preparation, while the secondary zone manages refinement and quality control before final output staging.</p><p>Each zone maintains independent environmental controls and safety interlocks. Personnel movement between zones is governed by the access protocol described in section 2.</p><ul><li>Zone A — Intake and preparation</li><li>Zone B — Refinement and QC</li><li>Zone C — Output staging</li></ul><table><tr><th>Zone</th><th>Capacity</th><th>Staff</th></tr><tr><td>Zone A</td><td>1,200 u/day</td><td>14</td></tr><tr><td>Zone B</td><td>980 u/day</td><td>11</td></tr></table></article></section>
          <div class="collapsed">Developer output — Markdown &amp; JSON <span>⌄</span></div><div class="history-heading">Parsing history</div>`, "parsing-result");
      }

      const strategyCards = `<div class="strategy-cards"><div class="strategy-card"><div><strong>Fixed token</strong><span class="radio"></span></div><p>Simple deterministic chunks with fixed token boundaries.</p></div><div class="strategy-card"><div><strong>Recursive</strong><span class="radio"></span></div><p>Preserves larger natural text boundaries before splitting further.</p></div><div class="strategy-card selected"><div><strong>Structure-aware</strong><span class="radio"></span></div><p>Uses document structure such as headings, sections and tables.</p></div></div>`;
      function chunking(result) {
        const resultBlock = result ? `<div class="action-line"><button class="button primary">Create chunks</button><span class="last-run">Last run · Structure-aware · 512 tokens</span></div><section class="results-row" data-testid="figma-chunk-results"><div><div class="metric-label">Chunk count</div><div class="metric-value">34</div></div><div><div class="metric-label">Avg tokens</div><div class="metric-value">497</div></div><div><div class="metric-label">Min tokens</div><div class="metric-value">221</div></div><div><div class="metric-label">Max tokens</div><div class="metric-value">512</div></div></section><div class="inspector-heading">Chunk inspector</div><section class="surface chunk-inspector" data-testid="figma-chunk-inspector"><aside class="chunk-list"><div class="chunk-list-head"><strong>Chunks</strong><span class="quiet" style="float:right;font-size:12px">34 total</span><div class="filter">Filter by section or number</div></div><div class="chunk-item selected"><strong>01 &nbsp; Facility Layout</strong><small>Overview · p.3–4</small></div><div class="chunk-item"><strong>02 &nbsp; Operating Hours</strong><small>Overview · p.6</small></div><div class="chunk-item"><strong>03 &nbsp; PPE Requirements</strong><small>Safety Procedures · p.10</small></div><div class="chunk-item"><strong>04 &nbsp; Maintenance</strong><small>Maintenance · p.27–28</small></div></aside><article class="chunk-detail"><div class="chunk-detail-head"><div><span class="tag">Chunk 1</span><p class="quiet">Overview&nbsp; › &nbsp;Facility Layout</p></div><button class="small-button">▣ &nbsp; View source</button></div><div class="chunk-text"><span class="mono quiet">498 tokens &nbsp; · &nbsp; pages 3–4 &nbsp; · &nbsp; 6 elements</span><p>The Karaman facility spans three interconnected operational zones. The primary processing area handles intake and initial preparation, while the secondary zone manages refinement and quality control.</p></div></article></section>` : `<div class="field-grid"><div class="field"><label>Chunk size</label><p>Controls how much text each retrieval unit can contain.</p><div class="fake-input">512 <span>tokens</span></div></div><div class="field"><label>Overlap</label><p>Shared tokens between neighboring chunks to preserve continuity.</p><div class="fake-input">64 <span>tokens</span></div></div></div><div class="action-line"><button class="button primary">Create chunks</button></div>`;
        return shell("chunking", `${header("Build", "Chunking", "Split structured content into pieces your retriever can search independently.")}
          <section class="surface stage-source" data-testid="figma-chunk-source"><div class="source-col"><label>Source</label><strong>Karaman Operations.pdf</strong></div><div class="source-col"><label>Based on</label><strong>Latest Parse</strong></div><div class="source-col"><label>Parsed elements</label><strong>1,204</strong></div></section>
          <div class="strategy-layout"><section class="strategy-copy"><h2>Strategy</h2><p>Controls how content is divided into retrieval units.</p>${strategyCards}</section><aside class="why"><strong>ⓘ &nbsp; Why this matters</strong><p>Larger chunks preserve more context, but may reduce retrieval precision. Smaller chunks can improve precision but may lose surrounding context.</p></aside></div>
          ${resultBlock}`, result ? "chunking-result" : "chunking-config");
      }

      function embeddings(result) {
        const resultSummary = result ? `<section class="embedding-results"><div class="section-label">Result summary</div><div class="embedding-result-grid"><div><div class="metric-label">Model</div><div class="metric-value" style="font-size:18px;letter-spacing:0">Gemini Embedding</div></div><div><div class="metric-label">Dimensions</div><div class="metric-value">768</div></div><div><div class="metric-label">Vectors</div><div class="metric-value">34</div></div><div><div class="metric-label">Storage</div><div class="metric-value" style="font-size:18px;letter-spacing:0">Vector index</div></div></div></section><div class="collapsed">Embedding details <span>⌄</span></div><div class="history-heading">Embedding history</div><div class="surface history-card"><div><strong>Current&nbsp; <span class="quiet">· Gemini Embedding</span></strong><p>34 vectors · 768 dim · Created 6 minutes ago</p></div>${status("Ready")}</div><div class="surface history-card"><div><strong>Previous&nbsp; <span class="quiet">· Gemini Embedding</span></strong><p>31 vectors · 768 dim · Created yesterday</p></div></div>` : "";
        return shell("embeddings", `${header("Build", "Embeddings", "Turn each chunk into a vector representation that lets the system compare meaning.", result ? `<button class="button primary">Test in Playground&nbsp; →</button>` : `<button class="button primary">Create embeddings</button>`)}
          <section class="surface stage-source" data-testid="figma-embeddings-input"><div class="source-col"><label>Input</label><strong>34 chunks</strong></div><div class="source-col" style="min-width:303px"><label>Based on</label><strong>Current Chunking · Structure-aware · 512 tokens</strong></div><div class="source-col"><label>Embedding model</label><strong>Gemini Embedding</strong></div></section>
          <section class="embedding-explainer"><div class="section-label">What happens here</div><p>Each chunk becomes one embedding vector. Those vectors are stored so the system can find chunks by meaning rather than exact keywords.</p><div class="embedding-flow"><div class="embedding-card"><div class="glyph">▤</div><strong>34 chunks</strong><span>Structure-aware</span></div><div class="flow-arrow">→</div><div class="embedding-card selected"><div class="glyph">⌘</div><strong>34 embeddings</strong><span>768-dim vectors</span></div><div class="flow-arrow">→</div><div class="embedding-card"><div class="glyph">▤</div><strong>Searchable storage</strong><span>Vector index ready</span></div></div></section>
          ${resultSummary}`, result ? "embeddings-result" : "embeddings-ready");
      }

      function questionCard(answered = true) { return `<section class="surface question-card" data-testid="figma-playground-question"><div class="question-text ${answered ? "" : "placeholder"}">${answered ? "What are the operating zones at the Karaman facility?" : "Ask your document…"}</div><button class="button primary question-action">✦ &nbsp; Run experiment</button><div class="question-controls"><span class="control-label">Retrieval</span><div class="segmented"><span>Dense</span><span class="selected">Hybrid</span><span>Keyword</span></div><span class="control-label">Top K</span><div class="top-k">− &nbsp;&nbsp; 5 &nbsp;&nbsp; +</div><span class="control-label">Reranker</span><div class="switch"></div></div></section>`; }
      function trace(active) { return `<div class="section-label trace-label">STAGE TRACE</div><div class="surface trace-card"><div class="trace-row"><span class="trace-dot" style="background:#f2eff0;border-color:#f2eff0"></span><strong>Query</strong></div><div class="trace-row ${active === "retrieval" ? "active" : ""}"><span class="trace-dot"></span><span>Retrieval</span><span>218 ms</span></div><div class="trace-row ${active === "context" ? "active" : ""}"><span class="trace-dot"></span><span>Reranking</span><span>96 ms</span></div><div class="trace-row ${active === "context" ? "active" : ""}"><span class="trace-dot"></span><span>Context</span><span>14 ms</span></div><div class="trace-row ${active === "answer" ? "active" : ""}"><span class="trace-dot"></span><span>Answer</span><span>843 ms</span></div></div><div class="previous-heading">Previous runs</div><div class="surface previous-card"><strong>What PPE is required on the operations floor?</strong><small>Hybrid · Top 5 · Reranker on · 3 min ago</small></div><div class="surface previous-card"><strong>When are maintenance windows scheduled?</strong><small>Dense · Top 10 · Reranker off · 18 min ago</small></div><div class="surface previous-card"><strong>What is emergency protocol B-14?</strong><small>Hybrid · Top 5 · Reranker on · Yesterday</small></div>`; }
      function playground(state) {
        const empty = state === "empty";
        let inspector = `<div class="surface" style="height:280px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px"><div><div class="summary-icon" style="margin:auto;font-size:22px;color:var(--cherry)">⌕</div><h2 style="margin:20px 0 0;font-size:18px">Ready to test your RAG</h2><p class="muted" style="margin:8px 0 0;font-size:14px;line-height:21px">Ask a question to inspect retrieval, context and the final answer.</p></div></div>`;
        if (state === "retrieval") inspector = `<div class="inspector-title"><div><h2>Retrieved candidates</h2><p>Retrieval finds candidate chunks most likely to contain the answer. These are not yet the final context.</p></div>${status("Hybrid · 4 candidates", "success")}</div><div style="margin-top:20px;display:grid;gap:8px"><div class="surface previous-card"><strong><b style="color:var(--cherry)">1&nbsp; Safety Procedures › PPE Requirements</b></strong><small>0.9421 · p.10</small><p class="muted" style="font-size:13px;line-height:20px">Personnel entering the operations floor must wear approved personal protective equipment.</p></div><div class="surface previous-card"><strong><b style="color:var(--cherry)">2&nbsp; Maintenance Schedule</b></strong><small>0.8210 · p.18</small><p class="muted" style="font-size:13px;line-height:20px">Maintenance windows and operating zones are recorded in the facility schedule.</p></div></div>`;
        if (state === "context") inspector = `<div class="inspector-title"><div><h2>Build context</h2><p>Retrieved chunks are not automatically the final context. StepLab selects which candidates fit the token budget.</p></div></div><div class="info-callout"><strong>ⓘ &nbsp; Retrieved is not the same as included</strong><br />A chunk can be retrieved yet excluded from the final context — usually because the token budget is full or it adds little new information.</div><div class="surface candidate-table"><div class="candidate-row header"><span>Candidate</span><span>Decision</span><span>Reason</span><span>Tokens</span></div><div class="candidate-row"><span>#1</span><span class="included">✓ Included</span><span class="muted">Highest relevance</span><span class="muted">476</span></div><div class="candidate-row"><span>#2</span><span class="included">✓ Included</span><span class="muted">Strong supporting evidence</span><span class="muted">503</span></div><div class="candidate-row"><span>#3</span><span class="included">✓ Included</span><span class="muted">Adds definition context</span><span class="muted">421</span></div><div class="candidate-row"><span>#4</span><span class="muted">△ Excluded</span><span class="muted">Exceeds token budget</span><span class="muted">648</span></div></div><div class="surface final-context"><div class="final-context-head">Final context <span>1,400 / 4,096 tokens</span></div><div class="progress"><span></span></div><a>Expand final context</a></div>`;
        if (state === "answer") inspector = `<div class="inspector-title"><div><h2>Answer</h2><p>The model generates an answer grounded only in the final context, with citations back to sources.</p></div>${status("Complete")}</div><div class="surface" style="min-height:131px;margin-top:20px;padding:24px;font-size:16px;line-height:26px">Personnel entering the operations floor must wear approved personal protective equipment at all times. Operating zones are separated by safety controls and access protocols.</div><h3 style="margin:20px 0 12px;font-size:13px">Sources</h3><div class="surface previous-card"><strong>1 &nbsp; Safety Procedures › PPE Requirements</strong><small>p.10</small></div><div class="surface previous-card"><strong>2 &nbsp; Maintenance Schedule</strong><small>p.18</small></div><div class="collapsed" style="margin-top:8px">Run details <span>⌄</span></div>`;
        return shell("playground", `${header("Test", "Playground", "Ask a question and inspect how your RAG system reaches the answer.")}${questionCard(!empty)}<div class="collapsed" style="margin-top:24px">Advanced configuration <span>⌄</span></div>${empty ? `<div style="margin-top:32px">${inspector}</div>` : `<div class="playground-grid"> <aside>${trace(state === "answer" ? "answer" : state)}</aside><section>${inspector}</section></div>`}`, `playground-${state}`);
      }

      const evalConfig = `<section class="surface eval-config" data-testid="figma-evaluation-config"><div class="eval-controls"><div class="eval-field"><label>Dataset</label><strong>Karaman Golden Set · v2</strong></div><div class="eval-field"><label>Retrieval</label><div class="segmented"><span>Dense</span><span class="selected">Hybrid</span><span>Keyword</span></div></div><div class="eval-field"><label>Top K</label><div class="top-k">5</div></div><div class="eval-field" style="padding-top:26px"><label style="display:inline">Reranker</label>&nbsp;<span class="switch" style="display:inline-block;vertical-align:middle"></span></div><button class="button primary eval-run">Run evaluation</button></div><div class="eval-advanced">Advanced — judge configuration <span>⌄</span></div></section>`;
      function evaluation(state) {
        const activeTab = state === "compare" ? "Compare" : state === "results" ? "Results" : "Dataset";
        const tabs = `<div class="tabs"><span class="${activeTab === "Dataset" ? "selected" : ""}">Dataset</span><span class="${activeTab === "Results" ? "selected" : ""}">Results</span><span class="${activeTab === "Compare" ? "selected" : ""}">Compare</span></div>`;
        let body = `${evalConfig}`;
        if (state === "compare") body += `<div class="compare-runs"><article class="surface run-card"><label>RUN A</label><strong>Recursive · 256 tokens</strong><p>Dense · Top 10 · Reranker off</p></article><span class="vs">VS</span><article class="surface run-card"><label>RUN B</label><strong>Structure-aware · 512 tokens</strong><p>Hybrid · Top 5 · Reranker on</p></article></div><div class="section-label delta-heading">Metric deltas</div><div class="delta-list">${[["Recall@5","+0.08"],["MRR","+0.04"],["Precision@5","+0.03"],["Groundedness","-0.02"],["Citation validity","+0.03"]].map(([label,delta]) => `<div class="delta-row"><span>${label}</span><div class="delta-bar"><span></span></div><span class="delta">${delta}</span></div>`).join("")}</div><div class="surface insight">→ &nbsp; Run B improved retrieval recall and ranking, at a small cost to groundedness. Structure-aware chunking with hybrid retrieval surfaced more relevant evidence — the slight groundedness dip suggests the reranker occasionally promoted broader passages.</div>`;
        else body += `<div class="eval-grid"><section><div class="quality-title">Retrieval quality</div><div class="quality-grid">${[["Hit@5","0.92"],["Recall@5","0.84"],["Precision@5","0.61"],["MRR","0.79"]].map(([a,b]) => `<div><div class="metric-label">${a}</div><div class="metric-value">${b}</div></div>`).join("")}</div><div class="quality-title answer-quality">Answer quality</div><div class="quality-grid" style="grid-template-columns:repeat(2,1fr)"><div><div class="metric-label">Citation validity</div><div class="metric-value">0.88</div></div><div><div class="metric-label">Groundedness</div><div class="metric-value">0.91</div></div></div></section><aside class="surface cases"><div class="quality-title">Cases</div><strong>11</strong><p>/ 12 passed</p><small>Judge model · Gemini 2.5</small><div class="progress"><span style="width:92%"></span></div></aside></div><section class="diagnostics"><h2 class="diagnostic-title">Case diagnostics</h2><article class="surface diagnostic"><div class="diagnostic-head"><span class="checkmark">✓</span><strong>What PPE is required on the operations floor?</strong><span class="mono">ground 0.95 · cite 1.00</span></div><div class="diagnostic-body"><div><label>Expected sources</label><p>Safety Procedures › Emergency Protocol</p></div><div><label>Retrieved sources</label><p style="color:var(--text)">Safety Procedures › Overview (p.9)</p></div><div><label>Answer</label><p style="color:var(--muted)">The answer correctly cited the expected source with high groundedness.</p></div></div></article><article class="surface diagnostic"><div class="diagnostic-head"><span class="checkmark">✓</span><strong>When are maintenance windows scheduled?</strong><span class="mono">ground 0.89 · cite 0.90</span></div></article><article class="surface diagnostic"><div class="diagnostic-head"><span style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fbefef;color:var(--danger)">△</span><strong>What is emergency protocol B-14?</strong><span class="mono">ground 0.42 · cite 0.50</span></div></article></section>`;
        return shell("evaluation", `${header("Test", "Evaluation", "Measure how reliably your RAG retrieves evidence and produces grounded answers.")}${tabs}${body}`, `evaluation-${state}`);
      }

      function settings() { return shell("settings", `${header("Workspace", "Settings", "Manage your workspace preferences.")}
        <section class="surface settings-card" data-testid="figma-settings-card"><div class="settings-row"><div><strong>Language</strong><p>Choose the language used across the learning workspace.</p></div><div class="settings-control"><span class="selected">English</span><span>Türkçe</span></div></div><div class="settings-row"><div><strong>Learning hints</strong><p>Show short explanations beside pipeline decisions.</p></div><div class="switch"></div></div><div class="settings-row"><div><strong>Reset preferences</strong><p>Restore the default language and learning preferences.</p></div><button class="button">Reset</button></div></section>`, "settings"); }

      function auth(state) {
        const signup = state === "signup"; const forgot = state === "forgot";
        const title = signup ? "Create account" : forgot ? "Reset your password" : "Sign in";
        const subtitle = signup ? "Create your RAG StepLab workspace." : forgot ? "We’ll send a link to reset your password." : "Continue to your RAG StepLab workspace.";
        return `<div class="auth-page" data-screen="auth-${state}"><div class="auth-language lang"><span class="selected">EN</span><span>TR</span></div><section class="auth-card"><aside class="auth-promo"><div class="auth-brand">${icon("brand-mark")}<strong>RAG StepLab</strong></div><h1>Understand every step of your RAG.</h1><p>Learn how retrieval-augmented generation works by inspecting the decisions between a document and an answer.</p><div class="auth-feature"><div><strong>Real parsing</strong><p>Extract structure and meaning with precision.</p></div><div><strong>Inspectable retrieval</strong><p>See chunks, context and sources at every step.</p></div><div><strong>Measurable evaluation</strong><p>Evaluate your RAG with metrics that matter.</p></div></div><div class="auth-placeholder">ASSET / ${state.toUpperCase()} / HERO</div></aside><main class="auth-form"><h2>${title}</h2><p>${subtitle}</p>${forgot ? `<div class="form-fields"><div class="form-field"><label>Email</label><div class="fake-input">ayse@steplab.dev</div></div></div><button class="button primary auth-submit">Send reset link</button><div class="auth-switch">Remember your password? <strong>Sign in</strong></div>` : `<div class="form-fields"><div class="form-field"><label>Email</label><div class="fake-input">ayse@steplab.dev</div></div><div class="form-field"><label>Password</label><div class="fake-input">••••••••••••</div></div></div>${!signup ? `<div class="form-link">Forgot password?</div>` : ""}<button class="button primary auth-submit">${signup ? "Create account" : "Sign in"}</button><div class="auth-divider">or continue with</div><button class="button google">G &nbsp; Continue with Google</button><div class="auth-switch">${signup ? "Already have an account?" : "Don't have an account?"} <strong>${signup ? "Sign in" : "Create account"}</strong></div>`}</main></section></div>`;
      }

      const screen = new URLSearchParams(location.search).get("screen") || "documents";
      const pages = {
        "documents-populated": documents,
        "parsing-result": parsing,
        "chunking-config": () => chunking(false),
        "chunking-result": () => chunking(true),
        "embeddings-ready": () => embeddings(false),
        "embeddings-result": () => embeddings(true),
        "playground-empty": () => playground("empty"),
        "playground-retrieval": () => playground("retrieval"),
        "playground-context": () => playground("context"),
        "playground-answer": () => playground("answer"),
        "evaluation-dataset": () => evaluation("dataset"),
        "evaluation-results": () => evaluation("results"),
        "evaluation-compare": () => evaluation("compare"),
        settings,
      };
      const fixture = document.getElementById("fixture");
      if (screen.startsWith("auth-")) fixture.innerHTML = auth(screen.slice(5));
      else fixture.innerHTML = (pages[screen] || documents)();
      document.title = `RAG StepLab · ${screen}`;
    </script>
  </body>
</html>

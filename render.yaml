services:
  - type: web
    name: rag-steplab-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: LOG_LEVEL
        value: INFO
      - key: WRITE_ENABLED
        value: "true"
      - key: MAX_FILE_SIZE_BYTES
        value: "52428800"
      - key: MAX_CONCURRENT_PIPELINE_RUNS
        value: "1"
      - key: DATABASE_SCHEMA
        value: rag_lab
      - key: SUPABASE_STORAGE_BUCKET
        value: rag-documents
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GEMINI_GENERATION_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_RERANK_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_JUDGE_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
      - key: GEMINI_MAX_RETRIES
        value: "2"
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
